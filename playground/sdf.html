<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compositor-gpu distance field playground</title>
    <style>
      @font-face {
        font-family: 'Inter Play';
        src: url('/InterVariable.ttf');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter Play', system-ui, sans-serif;
        background: #0e0f13;
        color: #f4f1ea;
      }
      main {
        min-height: 100vh; padding: 72px; display: flex; flex-direction: column;
        gap: 56px; align-items: flex-start;
      }
      h1 { font-size: 120px; letter-spacing: -0.04em; margin: 0; line-height: 1; }
      /* The field takes in everything the heading draws, a focus ring too. */
      h1:focus { outline: none; }
      .row { display: flex; gap: 56px; align-items: center; }
      .card {
        width: 260px; height: 160px; border-radius: 28px; background: #e9e4d8;
        color: #0e0f13; padding: 24px; font-size: 22px; font-weight: 600;
      }
      .icon { width: 120px; height: 120px; display: block; }
      .row img { width: 200px; height: 140px; border-radius: 50%; object-fit: cover; }
      #controls {
        position: fixed; bottom: 16px; right: 16px; z-index: 2147483647;
        display: flex; gap: 8px; align-items: center; font: 13px system-ui;
        color: #f4f1ea;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="word">Glow</h1>
      <div class="row">
        <div class="card" id="card">A card with rounded corners</div>
        <svg class="icon" id="icon" viewBox="0 0 24 24" data-gpu-vector>
          <path d="M12 3 L14.6 9.4 L21.5 9.9 L16.2 14.3 L17.9 21 L12 17.3 L6.1 21 L7.8 14.3 L2.5 9.9 L9.4 9.4 Z" fill="#ffcf5c" />
        </svg>
        <img id="pic" src="./test.png" alt="" />
      </div>
    </main>
    <div id="controls" data-gpu-ignore>
      <label><input id="on" type="checkbox" /> glow</label>
    </div>
    <script type="module" src="./sdf.ts"></script>
  </body>
</html>
