<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compositor-gpu layout morph playground</title>
    <style>
      @font-face {
        font-family: 'Inter Play';
        src: url('/InterVariable.ttf');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter Play', system-ui, sans-serif;
        background: #f4f1ea;
        color: #151517;
      }
      main { min-height: 100vh; padding: 48px 64px; }
      main.tall { min-height: 300vh; padding-top: 420px; }
      h1 { margin: 0; letter-spacing: -0.04em; line-height: 1; }
      .card { overflow: hidden; }
      .card img { display: block; width: 100%; object-fit: cover; }
      .card h2 { margin: 0; letter-spacing: -0.02em; }
      p { margin: 0; max-width: 60ch; font-size: 18px; line-height: 1.5; }
      .card .row { display: flex; align-items: center; justify-content: space-between; }
      .icon { display: block; flex: none; }
      .mark { display: block; }
      main.a .mark { width: 160px; height: 160px; margin-top: 32px; }
      main.b .mark { width: 72px; height: 72px; align-self: flex-end; }
      main.a .card .icon { width: 28px; height: 28px; margin-right: 20px; }
      main.b .hero .icon { width: 56px; height: 56px; margin-right: 28px; }
      main.b .side .card .row { flex: 1; }
      main.b .side .card .icon { width: 20px; height: 20px; margin-right: 16px; }

      /* State a: a heading and a grid of three cards. */
      main.a h1 { font-size: 72px; margin-bottom: 32px; }
      main.a .grid { display: flex; gap: 24px; }
      main.a .card {
        width: 300px; background: #fff; border-radius: 20px;
      }
      main.a .card img { height: 200px; }
      main.a .card h2 { font-size: 26px; padding: 16px 20px 20px; }

      /* State b: the first card open as a hero, the rest in a column. */
      main.b {
        display: grid; grid-template-columns: 1fr 260px; gap: 32px;
        align-content: start; align-items: start;
      }
      main.b h1 { font-size: 28px; grid-column: 1 / 3; }
      main.b .hero {
        background: #151517; color: #f4f1ea; border-radius: 6px;
      }
      main.b .hero img { height: 360px; }
      main.b .hero h2 { font-size: 64px; padding: 24px 28px 8px; }
      main.b .hero p { padding: 0 28px 28px; color: #c9c5bb; }
      main.b .side { display: flex; flex-direction: column; gap: 16px; }
      main.b .side .card {
        background: #fff; border-radius: 12px; display: flex;
        align-items: center;
      }
      main.b .side .card img { width: 96px; height: 96px; }
      main.b .side .card h2 { font-size: 18px; padding: 0 16px; }

      #controls {
        position: fixed; bottom: 16px; right: 16px; z-index: 2147483647;
        display: flex; gap: 8px; align-items: center; font: 13px system-ui;
      }
      #controls button {
        padding: 8px 14px; border-radius: 999px; border: 1px solid #0002;
        background: #fff; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main id="page" class="a"></main>
    <div id="controls" data-gpu-ignore>
      <label><input id="wave" type="checkbox" /> shockwave</label>
      <button id="next" type="button">Next</button>
    </div>
    <script type="module" src="./layout.ts"></script>
  </body>
</html>
