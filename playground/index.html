<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compositor-gpu playground</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        font-family: -apple-system, system-ui, sans-serif;
        line-height: 1.5;
        padding: 8vh 6vw;
        background: #0b0b0c;
        color: #f2f2f2;
      }
      h1 { font-size: clamp(2rem, 8vw, 5rem); margin: 0 0 0.3em; letter-spacing: -0.02em; }
      p { max-width: 40ch; font-size: 1.25rem; }
      .card {
        margin-top: 2rem;
        padding: 1.5rem;
        border-radius: 20px;
        background: #17171a;
        border: 1px solid #2a2a30;
        max-width: 40ch;
      }
      .pill {
        display: inline-block;
        padding: 0.4rem 0.9rem;
        border-radius: 999px;
        background: #3b82f6;
        color: white;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <h1>Every letter can move.</h1>
    <p>
      This is a real DOM. <span class="pill">Selectable</span>, accessible, and
      laid out by the browser — then mirrored onto the GPU and painted with the
      Slug algorithm.
    </p>
    <div class="card">
      Boxes, borders and radii are mirrored as instanced rounded rects. Scroll,
      resize, and watch it stay in step.
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
