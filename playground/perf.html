<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compositor-gpu perf</title>
    <style>
      @font-face {
        font-family: 'Inter Play';
        src: url('/InterVariable.ttf');
        font-weight: 100 900;
      }
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: 'Inter Play', -apple-system, system-ui, sans-serif;
        font-optical-sizing: none;
        background: #0b0b0c;
        color: #f2f2f2;
        -webkit-font-smoothing: antialiased;
      }
      #stage {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 20px;
        padding: 24px;
      }
      .pcard {
        border-radius: 14px;
        border: 1px solid #33333a;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        background: #17171a;
        padding: 16px 18px;
      }
      .pwrap { min-width: 0; }
      .pcard.rot { transform: rotate(2deg); }
      .pcard.dim { opacity: 0.8; }
      .pcard.hot { background: #3b1d4a; border-color: #8b5cf6; }
      .pcard h3 {
        margin: 0 0 8px;
        font-size: 16px;
        letter-spacing: -0.01em;
      }
      .pcard p {
        margin: 0 0 8px;
        font-size: 13px;
        line-height: 1.45;
        color: #d6d6e0;
      }
      .pcard p a {
        color: #8ab4ff;
        text-decoration: underline;
      }
      .pcard p b { font-weight: 700; }
      .pcard p i { font-style: italic; font-weight: 300; }
      .pcard ul {
        margin: 0 0 8px;
        padding-left: 1.2rem;
        font-size: 12px;
        color: #b3b3bd;
      }
      .pcard img {
        display: block;
        width: 48px;
        height: 48px;
        border-radius: 8px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module" src="./perf.ts"></script>
  </body>
</html>
