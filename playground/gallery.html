<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>compositor-gpu gallery playground</title>
    <style>
      @font-face {
        font-family: 'Inter Play';
        src: url('/InterVariable.ttf');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: 'Inter Play', system-ui, sans-serif; }
      main {
        min-height: 100vh; padding: 64px; background: #f4f1ea;
        color: #151517;
      }
      h1 { font-size: 96px; letter-spacing: -0.04em; margin: 0 0 16px; }
      p { max-width: 56ch; font-size: 20px; line-height: 1.5; }
      .grid {
        display: grid; grid-template-columns: repeat(4, 200px); gap: 20px;
        margin-top: 40px;
      }
      .grid img {
        width: 200px; height: 150px; object-fit: cover; display: block;
        border-radius: 8px;
      }
      #nav {
        position: fixed; bottom: 16px; right: 16px; z-index: 2147483647;
        display: flex; gap: 8px; font: 14px system-ui;
      }
      #nav button { padding: 8px 14px; border-radius: 999px; border: 0; }
    </style>
  </head>
  <body>
    <main id="page">
      <h1>Index</h1>
      <p>The page's images become planes on a ring in perspective,
        entered through a reveal from the pointer and left through a
        white bloom.</p>
      <div class="grid" id="grid"></div>
    </main>
    <div id="nav" data-gpu-ignore>
      <button id="open" type="button">Gallery</button>
      <button id="close" type="button">Close</button>
    </div>
    <script type="module" src="./gallery.ts"></script>
  </body>
</html>
